experiments:
  weak_kth_easier:
    n: 10
    k: 3
    m: 3
    T: 1_000_000
    num_seeds: 30
    delta: 0.05

    algorithms:
      - topk_uif
      - rec_maxmin_ucb

    instance:
      kind: weak_kth
      strong_value: 1.0
      weak_optimal_value: 0.65
      decoy_value: 0.55
      tail_value: 0.20
      num_decoys: 7
      shuffle: true
      seed: 123

    output_dir: results/weak_kth_easier

  feedback_sensitivity_balanced:
    n: 16
    k: 6
    m: 6
    T: 1_000_000
    num_seeds: 10
    delta: 0.05

    algorithms:
      - topk_uif

    instance:
      kind: explicit
      theta:
        # 2 strong optimal arms
        - 1.00
        - 0.93

        # 4 moderately weak optimal arms
        - 0.82
        - 0.78
        - 0.74
        - 0.70

        # 6 decoys below the boundary
        - 0.60
        - 0.57
        - 0.54
        - 0.51
        - 0.48
        - 0.45

        # 4 clearly bad tail arms
        - 0.30
        - 0.25
        - 0.20
        - 0.15

    output_dir: results/feedback_sensitivity_balanced
    save_every: 10

  hardness_gap_sweep:
    # Base config for hardness_sweep.py. n, k, m, T, delta, num_seeds,
    # algorithms are reused as-is; the instance below is a placeholder that
    # gets replaced per boundary-gap value by hardness_sweep.py.
    #
    # n=10, k=3, m=3 matches the scale of weak_kth_easier (a config known to
    # work). Calibration (single seed, topk_uif, same n/k/m/delta):
    #   delta_min=0.2  completes at round  7,888  (T=100,000)
    #   delta_min=0.1  completes at round 33,019  (T=100,000)
    #   delta_min=0.05 does NOT complete within T=50,000
    # Completion time scales close to 1/delta_min^2, so T=500,000 gives
    # comfortable margin for delta_min down to ~0.03, and a near-plateau data
    # point at delta_min=0.02. Going down to 0.01 would need T on the order of
    # 3,000,000+ rounds (single-seed extrapolation) and is not included here.
    n: 10
    k: 3
    m: 3
    T: 500_000
    num_seeds: 20
    delta: 0.05

    algorithms:
      - topk_uif
      - rec_maxmin_ucb
      - uniform

    instance:
      kind: gap
      top_value: 1.0
      boundary_gap: 0.1

    output_dir: results/hardness_gap_sweep

  hardness_gap_sweep_quick:
    # Fast sanity-check variant of hardness_gap_sweep: fewer seeds, shorter
    # horizon, fewer gap values. Use this first to check the plot shape looks
    # right before committing to the full (much slower) sweep above.
    n: 10
    k: 3
    m: 3
    T: 150_000
    num_seeds: 5
    delta: 0.05

    algorithms:
      - topk_uif
      - rec_maxmin_ucb
      - uniform

    instance:
      kind: gap
      top_value: 1.0
      boundary_gap: 0.1

    output_dir: results/hardness_gap_sweep_quick

  top_gap_sweep:
    # Base config for top_gap_sweep.py. n, k, m, T, delta, num_seeds,
    # algorithms are reused as-is; the instance below is a placeholder
    # (top_gap_sweep.py builds its own theta per top_gap value, with
    # boundary_gap fixed at 0.2 by default via --boundary-gap).
    #
    # Calibration (single seed, topk_uif, n=10, k=3, m=3, delta=0.05,
    # boundary_gap=0.2 fixed, T=100,000):
    #   top_gap=0.2   completes at round  4,524
    #   top_gap=0.01  completes at round 10,217
    #   top_gap=0.001 completes at round  7,900
    # Unlike the boundary-gap sweep, completion time barely grows as top_gap
    # shrinks (no 1/gap^2 blowup) since resolving the rank-1/rank-2 gap is
    # not required for correct top-k set identification. T=200,000 gives
    # ample margin across the whole tested range, and the sweep is much
    # cheaper than hardness_gap_sweep as a result.
    n: 10
    k: 3
    m: 3
    T: 200_000
    num_seeds: 10
    delta: 0.05

    algorithms:
      - topk_uif
      - rec_maxmin_ucb
      - uniform

    instance:
      kind: top_gap
      top_value: 1.0
      top_gap: 0.1
      boundary_gap: 0.2

    output_dir: results/top_gap_sweep

  top_gap_sweep_quick:
    # Fast sanity-check variant of top_gap_sweep: fewer seeds, shorter
    # horizon, fewer top_gap values.
    n: 10
    k: 3
    m: 3
    T: 60_000
    num_seeds: 5
    delta: 0.05

    algorithms:
      - topk_uif
      - rec_maxmin_ucb
      - uniform

    instance:
      kind: top_gap
      top_value: 1.0
      top_gap: 0.1
      boundary_gap: 0.2

    output_dir: results/top_gap_sweep_quick

  mnl_topk_theta0_sweep:
    task: mnl_topk
    n: 30
    k: 5
    T: 1_000_000
    num_seeds: 30
    delta: 0.05

    algorithms:
      - mnl_topk_uif
      - sg_adaptive
      - sg_no_choice

    # Sweep the no-choice parameter.
    # Smaller theta0 means no-choice is rarely selected.
    theta0_values:
      - 1.0
      - 0.1
      - 0.01
      - 0.001

    sg_x_scale: 2.0

    instance:
      kind: explicit
      theta:
        - 1.00
        - 0.95
        - 0.90
        - 0.85
        - 0.80
        - 0.65
        - 0.62
        - 0.59
        - 0.56
        - 0.53
        - 0.50
        - 0.47
        - 0.44
        - 0.41
        - 0.38
        - 0.35
        - 0.32
        - 0.29
        - 0.26
        - 0.23
        - 0.20
        - 0.18
        - 0.16
        - 0.14
        - 0.12
        - 0.10
        - 0.08
        - 0.06
        - 0.04
        - 0.02

    output_dir: results/mnl_topk_theta0_sweep
    save_every: 100